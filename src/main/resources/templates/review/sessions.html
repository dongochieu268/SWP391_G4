<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Phiên phản biện</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container page-shell">
    <h1 class="h3 mb-4">Review & phản biện</h1>
    <div class="card"><div class="card-body">
        <table class="table align-middle">
            <thead><tr><th>Tiêu đề</th><th>Loại</th><th>Thực hiện</th><th>Hỗ trợ</th><th>Phản biện</th><th>Lịch</th><th></th></tr></thead>
            <tbody>
            <tr th:each="session : ${reviews}">
                <td th:text="${session.title}"></td>
                <td th:text="${session.targetType}"></td>
                <td th:text="${session.performer == null ? '-' : session.performer.fullName}"></td>
                <td th:text="${session.supporter == null ? '-' : session.supporter.fullName}"></td>
                <td th:text="${session.reviewer == null ? '-' : session.reviewer.fullName}"></td>
                <td th:text="${session.scheduledAt == null ? '-' : #temporals.format(session.scheduledAt, 'dd/MM/yyyy HH:mm')}"></td>
                <td><a class="btn btn-primary btn-sm" th:href="@{/review/sessions/{id}(id=${session.id})}">Chuẩn bị câu hỏi</a></td>
            </tr>
            </tbody>
        </table>
    </div></div>
</main>
</body>
</html>
