<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chi tiết phản biện</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container page-shell">
    <h1 class="h3" th:text="${session.title}"></h1>
    <p class="text-muted" th:text="${session.targetType + ' - ' + session.status}"></p>
    <div class="row g-4">
        <div class="col-lg-5">
            <div class="card"><div class="card-body">
                <h2 class="h4">Chuẩn bị câu hỏi</h2>
                <form th:action="@{/review/sessions/{id}/questions(id=${session.id})}" method="post">
                    <textarea class="form-control mb-2" name="questionText" placeholder="Câu hỏi phản biện" required></textarea>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="askedLive" value="true">
                        <label class="form-check-label">Đã hỏi trực tiếp</label>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="saveToBank" value="true" checked>
                        <label class="form-check-label">Lưu vào Question Bank</label>
                    </div>
                    <button class="btn btn-primary">Lưu câu hỏi</button>
                </form>
            </div></div>
        </div>
        <div class="col-lg-7">
            <div class="card"><div class="card-body">
                <h2 class="h4">Danh sách câu hỏi</h2>
                <div th:each="question : ${questions}" class="border rounded p-3 mb-2">
                    <strong th:text="${question.questionText}"></strong>
                    <div>
                        <span class="badge bg-secondary" th:text="${question.askedLive ? 'Đã hỏi trực tiếp' : 'Chuẩn bị'}"></span>
                        <span class="badge badge-soft" th:text="${question.savedToBank ? 'Đã lưu Question Bank' : 'Không lưu bank'}"></span>
                    </div>
                </div>
            </div></div>
        </div>
    </div>
</main>
</body>
</html>
