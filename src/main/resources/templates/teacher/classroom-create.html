<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mentora – Tạo lớp học</title>
    <link rel="shortcut icon" type="image/png" href="/assets/images/logos/favicon.png" />
    <link rel="stylesheet" href="/assets/css/styles.min.css" />
</head>
<body>
<div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6"
     data-sidebartype="full" data-sidebar-position="fixed" data-header-position="fixed">

    <aside th:replace="~{fragments/teacher-sidebar :: sidebar('classroom-create')}"></aside>

    <div class="body-wrapper">
        <header class="app-header">
            <nav class="navbar navbar-expand-lg navbar-light">
                <ul class="navbar-nav">
                    <li class="nav-item d-block d-xl-none">
                        <a class="nav-link sidebartoggler" id="headerCollapse" href="javascript:void(0)">
                            <i class="ti ti-menu-2"></i>
                        </a>
                    </li>
                </ul>
                <div class="navbar-collapse justify-content-end px-0" id="navbarNav">
                    <ul class="navbar-nav flex-row ms-auto align-items-center justify-content-end">
                        <li class="nav-item dropdown">
                            <a class="nav-link" href="javascript:void(0)" id="drop2"
                               data-bs-toggle="dropdown" aria-expanded="false">
                                <img src="/assets/images/profile/user-1.jpg" alt="" width="35" height="35" class="rounded-circle">
                            </a>
                            <div class="dropdown-menu dropdown-menu-end dropdown-menu-animate-up" aria-labelledby="drop2">
                                <div class="message-body">
                                    <a href="javascript:void(0)" class="d-flex align-items-center gap-2 dropdown-item">
                                        <i class="ti ti-user fs-6"></i>
                                        <p class="mb-0 fs-3" th:text="${user != null ? user.fullName : 'Giảng viên'}">Giảng viên</p>
                                    </a>
                                    <a href="/logout" class="btn btn-outline-primary mx-3 mt-2 d-block">Đăng xuất</a>
                                </div>
                            </div>
                        </li>
                    </ul>
                </div>
            </nav>
        </header>

        <div class="body-wrapper-inner">
            <div class="container-fluid">

                <div class="row mb-4">
                    <div class="col-12">
                        <nav aria-label="breadcrumb">
                            <ol class="breadcrumb">
                                <li class="breadcrumb-item"><a href="/teacher">Dashboard</a></li>
                                <li class="breadcrumb-item"><a href="/teacher/classrooms">Lớp học</a></li>
                                <li class="breadcrumb-item active">Tạo lớp mới</li>
                            </ol>
                        </nav>
                        <h4 class="fw-semibold mb-0">Tạo lớp học mới</h4>
                    </div>
                </div>

                <div class="row">
                    <div class="col-lg-7 col-xl-6">
                        <div class="card">
                            <div class="card-body">
                                <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center gap-2 mb-4">
                                    <i class="ti ti-alert-circle"></i>
                                    <span th:text="${errorMessage}">Có lỗi xảy ra</span>
                                </div>

                                <form action="/teacher/classrooms/create" method="post">
                                    <div class="mb-3">
                                        <label for="name" class="form-label fw-semibold">
                                            Tên lớp học <span class="text-danger">*</span>
                                        </label>
                                        <input type="text" class="form-control" id="name" name="name"
                                               placeholder="VD: Lập trình Java – SE1801" required />
                                    </div>
                                    <div class="mb-3">
                                        <label for="subjectId" class="form-label fw-semibold">
                                            Môn học <span class="text-danger">*</span>
                                        </label>
                                        <select class="form-select" id="subjectId" name="subjectId" required>
                                            <option value="">-- Chọn môn học --</option>
                                            <option th:each="s : ${subjects}"
                                                    th:value="${s.id}"
                                                    th:text="${s.code + ' – ' + s.name}">
                                            </option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label for="learningPathId" class="form-label fw-semibold">
                                            Lộ trình học <span class="text-danger">*</span>
                                        </label>
                                        <select class="form-select" id="learningPathId" name="learningPathId" required>
                                            <option value="">-- Chọn lộ trình --</option>
                                            <option th:each="lp : ${learningPaths}"
                                                    th:value="${lp.id}"
                                                    th:text="${lp.name}">
                                            </option>
                                        </select>
                                    </div>
                                    <div class="mb-4">
                                        <label for="semesterId" class="form-label fw-semibold">
                                            Học kỳ <span class="text-danger">*</span>
                                        </label>
                                        <select class="form-select" id="semesterId" name="semesterId" required>
                                            <option value="">-- Chọn học kỳ --</option>
                                            <option th:each="sem : ${semesters}"
                                                    th:value="${sem.id}"
                                                    th:text="${sem.name}">
                                            </option>
                                        </select>
                                    </div>
                                    <div class="d-flex gap-2">
                                        <button type="submit" class="btn btn-primary px-4">
                                            <i class="ti ti-circle-plus me-1"></i> Tạo lớp học
                                        </button>
                                        <a href="/teacher/classrooms" class="btn btn-outline-secondary px-4">Huỷ</a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-5 col-xl-6">
                        <div class="card border-0 bg-light-subtle">
                            <div class="card-body">
                                <h6 class="fw-semibold mb-3">
                                    <i class="ti ti-info-circle me-1 text-primary"></i>Lưu ý
                                </h6>
                                <ul class="mb-0 ps-3 text-muted" style="font-size:14px; line-height:2">
                                    <li>Sau khi tạo, hệ thống tự sinh <strong>mã mời 8 ký tự</strong>.</li>
                                    <li>Dùng mã mời để mời sinh viên tham gia (UC26).</li>
                                    <li>Quản lý thành viên sau khi tạo xong (UC27).</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="/assets/libs/jquery/dist/jquery.min.js"></script>
<script src="/assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/sidebarmenu.js"></script>
<script src="/assets/js/app.min.js"></script>
<script src="/assets/libs/simplebar/dist/simplebar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.8/dist/iconify-icon.min.js"></script>
</body>
</html>
