<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mentora – Danh sách lộ trình học</title>
    <link rel="shortcut icon" type="image/png" href="/assets/images/logos/favicon.png" />
    <link rel="stylesheet" href="/assets/css/styles.min.css" />
</head>
<body>
<div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6"
     data-sidebartype="full" data-sidebar-position="fixed" data-header-position="fixed">

    <aside th:replace="~{fragments/teacher-sidebar :: sidebar('paths')}"></aside>

    <div class="body-wrapper">
        <header class="app-header">
            <nav class="navbar navbar-expand-lg navbar-light">
                <ul class="navbar-nav">
                    <li class="nav-item d-block d-xl-none">
                        <a class="nav-link sidebartoggler" id="headerCollapse" href="javascript:void(0)">
                            <i class="ti ti-menu-2"></i>
                        </a>
                    </li>
                </ul>
                <div class="navbar-collapse justify-content-end px-0" id="navbarNav">
                    <ul class="navbar-nav flex-row ms-auto align-items-center justify-content-end">
                        <li class="nav-item dropdown">
                            <a class="nav-link" href="javascript:void(0)" id="drop2"
                               data-bs-toggle="dropdown" aria-expanded="false">
                                <img src="/assets/images/profile/user-1.jpg" alt="" width="35" height="35" class="rounded-circle">
                            </a>
                            <div class="dropdown-menu dropdown-menu-end dropdown-menu-animate-up" aria-labelledby="drop2">
                                <div class="message-body">
                                    <a href="javascript:void(0)" class="d-flex align-items-center gap-2 dropdown-item">
                                        <i class="ti ti-user fs-6"></i>
                                        <p class="mb-0 fs-3" th:text="${user != null ? user.fullName : 'Giảng viên'}">Giảng viên</p>
                                    </a>
                                    <a href="/logout" class="btn btn-outline-primary mx-3 mt-2 d-block">Đăng xuất</a>
                                </div>
                            </div>
                        </li>
                    </ul>
                </div>
            </nav>
        </header>

        <div class="body-wrapper-inner">
            <div class="container-fluid">

                <!-- Breadcrumb & Title -->
                <div class="row mb-4">
                    <div class="col-12 d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <div>
                            <nav aria-label="breadcrumb">
                                <ol class="breadcrumb mb-1">
                                    <li class="breadcrumb-item"><a href="/teacher">Dashboard</a></li>
                                    <li class="breadcrumb-item active">Lộ trình học</li>
                                </ol>
                            </nav>
                            <h4 class="fw-semibold mb-0">Danh sách lộ trình học</h4>
                        </div>
                        <a href="/teacher/learning-paths/create" class="btn btn-primary d-flex align-items-center gap-2">
                            <i class="ti ti-circle-plus"></i> Tạo lộ trình mới
                        </a>
                    </div>
                </div>

                <!-- Empty state -->
                <div th:if="${#lists.isEmpty(paths)}" class="card">
                    <div class="card-body text-center py-5 text-muted">
                        <i class="ti ti-sitemap" style="font-size:3rem;opacity:.3;display:block;margin-bottom:1rem;"></i>
                        <p class="mb-3">Bạn chưa có lộ trình học nào.</p>
                        <a href="/teacher/learning-paths/create" class="btn btn-primary">
                            <i class="ti ti-circle-plus me-1"></i> Tạo lộ trình đầu tiên
                        </a>
                    </div>
                </div>

                <!-- Path list -->
                <div th:if="${!#lists.isEmpty(paths)}" class="row g-3">
                    <div th:each="path : ${paths}" class="col-md-6 col-xl-4">
                        <div class="card h-100">
                            <div class="card-body d-flex flex-column">
                                <div class="d-flex align-items-start gap-3 mb-3">
                                    <div class="p-2 bg-primary bg-opacity-10 rounded">
                                        <i class="ti ti-sitemap text-primary fs-5"></i>
                                    </div>
                                    <div class="flex-grow-1">
                                        <h6 class="fw-semibold mb-1" th:text="${path.name}">Tên lộ trình</h6>
                                        <small class="text-muted">
                                            Môn học ID: <span th:text="${path.subjectId}">–</span>
                                        </small>
                                    </div>
                                </div>

                                <p th:if="${path.description != null and !path.description.isEmpty()}"
                                   class="text-muted small flex-grow-1" th:text="${path.description}"></p>
                                <p th:if="${path.description == null or path.description.isEmpty()}"
                                   class="text-muted small flex-grow-1 fst-italic">Chưa có mô tả.</p>

                                <div class="mt-auto pt-3 border-top d-flex gap-2">
                                    <a th:href="@{'/teacher/learning-path/' + ${path.id} + '/nodes'}"
                                       class="btn btn-primary btn-sm flex-grow-1">
                                        <i class="ti ti-list-details me-1"></i> Quản lý Node
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="/assets/libs/jquery/dist/jquery.min.js"></script>
<script src="/assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/sidebarmenu.js"></script>
<script src="/assets/js/app.min.js"></script>
<script src="/assets/libs/simplebar/dist/simplebar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.8/dist/iconify-icon.min.js"></script>
</body>
</html>
