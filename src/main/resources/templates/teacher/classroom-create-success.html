<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mentora – Tạo lớp thành công</title>
    <link rel="shortcut icon" type="image/png" href="/assets/images/logos/favicon.png" />
    <link rel="stylesheet" href="/assets/css/styles.min.css" />
</head>
<body>
<div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6"
     data-sidebartype="full" data-sidebar-position="fixed" data-header-position="fixed">

    <aside th:replace="~{fragments/teacher-sidebar :: sidebar('classrooms')}"></aside>

    <div class="body-wrapper">
        <header class="app-header">
            <nav class="navbar navbar-expand-lg navbar-light">
                <ul class="navbar-nav">
                    <li class="nav-item d-block d-xl-none">
                        <a class="nav-link sidebartoggler" id="headerCollapse" href="javascript:void(0)">
                            <i class="ti ti-menu-2"></i>
                        </a>
                    </li>
                </ul>
                <div class="navbar-collapse justify-content-end px-0" id="navbarNav">
                    <ul class="navbar-nav flex-row ms-auto align-items-center justify-content-end">
                        <li class="nav-item dropdown">
                            <a class="nav-link" href="javascript:void(0)" id="drop2"
                               data-bs-toggle="dropdown" aria-expanded="false">
                                <img src="/assets/images/profile/user-1.jpg" alt="" width="35" height="35" class="rounded-circle">
                            </a>
                            <div class="dropdown-menu dropdown-menu-end dropdown-menu-animate-up" aria-labelledby="drop2">
                                <div class="message-body">
                                    <a href="/logout" class="btn btn-outline-primary mx-3 mt-2 d-block">Đăng xuất</a>
                                </div>
                            </div>
                        </li>
                    </ul>
                </div>
            </nav>
        </header>

        <div class="body-wrapper-inner">
            <div class="container-fluid">

                <div class="row mb-4">
                    <div class="col-12">
                        <nav aria-label="breadcrumb">
                            <ol class="breadcrumb">
                                <li class="breadcrumb-item"><a href="/teacher">Dashboard</a></li>
                                <li class="breadcrumb-item"><a href="/teacher/classrooms">Lớp học</a></li>
                                <li class="breadcrumb-item active">Tạo thành công</li>
                            </ol>
                        </nav>
                    </div>
                </div>

                <div class="row justify-content-center">
                    <div class="col-lg-6 col-xl-5">
                        <div class="card text-center">
                            <div class="card-body py-5">
                                <div class="mb-3">
                                    <div class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-10 rounded-circle"
                                         style="width:72px;height:72px;">
                                        <i class="ti ti-circle-check text-success" style="font-size:36px;"></i>
                                    </div>
                                </div>
                                <h4 class="fw-bold mb-1">Tạo lớp học thành công!</h4>
                                <p class="text-muted mb-4">Lớp đã được tạo và sẵn sàng để mời sinh viên.</p>

                                <div class="text-start border rounded p-3 mb-4 bg-light">
                                    <div class="d-flex justify-content-between py-2 border-bottom">
                                        <span class="text-muted">Tên lớp</span>
                                        <span class="fw-semibold" th:text="${newClassroom.name}">–</span>
                                    </div>
                                    <div class="d-flex justify-content-between py-2 border-bottom">
                                        <span class="text-muted">Môn học (ID)</span>
                                        <span class="fw-semibold" th:text="${newClassroom.subjectId}">–</span>
                                    </div>
                                    <div class="d-flex justify-content-between py-2 border-bottom">
                                        <span class="text-muted">Học kỳ (ID)</span>
                                        <span class="fw-semibold" th:text="${newClassroom.semesterId}">–</span>
                                    </div>
                                    <div class="d-flex justify-content-between align-items-center py-2">
                                        <span class="text-muted">Mã mời</span>
                                        <span class="badge bg-primary fs-4 px-3 py-2 font-monospace"
                                              th:text="${newClassroom.inviteCode}">XXXXXXXX</span>
                                    </div>
                                </div>

                                <div class="d-grid gap-2">
                                    <a href="/teacher/classrooms" class="btn btn-primary">
                                        <i class="ti ti-list me-1"></i> Xem danh sách lớp
                                    </a>
                                    <a href="/teacher/classrooms/create" class="btn btn-outline-secondary">
                                        <i class="ti ti-circle-plus me-1"></i> Tạo lớp khác
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="/assets/libs/jquery/dist/jquery.min.js"></script>
<script src="/assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/sidebarmenu.js"></script>
<script src="/assets/js/app.min.js"></script>
<script src="/assets/libs/simplebar/dist/simplebar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.8/dist/iconify-icon.min.js"></script>
</body>
</html>
