<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Fragment sidebar giảng viên.
  Sử dụng: th:replace="~{fragments/teacher-sidebar :: sidebar('tên-trang')}"
  Tên trang hợp lệ: dashboard | classrooms | classroom-create | paths | path-create
-->
<aside th:fragment="sidebar(activePage)" class="left-sidebar">
    <div>
        <div class="brand-logo d-flex align-items-center justify-content-between">
            <a href="/teacher" class="text-nowrap logo-img">
                <img src="/assets/images/logos/logo.svg" alt="Mentora" />
            </a>
            <div class="close-btn d-xl-none d-block sidebartoggler cursor-pointer" id="sidebarCollapse">
                <i class="ti ti-x fs-6"></i>
            </div>
        </div>

        <nav class="sidebar-nav scroll-sidebar" data-simplebar="">
            <ul id="sidebarnav">

                <!-- Tổng quan -->
                <li class="nav-small-cap">
                    <iconify-icon icon="solar:menu-dots-linear" class="nav-small-cap-icon fs-4"></iconify-icon>
                    <span class="hide-menu">Tổng quan</span>
                </li>
                <li class="sidebar-item">
                    <a class="sidebar-link"
                       th:classappend="${activePage == 'dashboard'} ? ' active'"
                       href="/teacher" aria-expanded="false">
                        <i class="ti ti-layout-dashboard"></i>
                        <span class="hide-menu">Dashboard</span>
                    </a>
                </li>

                <!-- Quản lý lộ trình học -->
                <li class="nav-small-cap">
                    <iconify-icon icon="solar:menu-dots-linear" class="nav-small-cap-icon fs-4"></iconify-icon>
                    <span class="hide-menu">Quản lý lộ trình học</span>
                </li>
                <li class="sidebar-item">
                    <a class="sidebar-link"
                       th:classappend="${activePage == 'paths'} ? ' active'"
                       href="/teacher/learning-paths" aria-expanded="false">
                        <i class="ti ti-sitemap"></i>
                        <span class="hide-menu">Danh sách lộ trình</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a class="sidebar-link"
                       th:classappend="${activePage == 'path-create'} ? ' active'"
                       href="/teacher/learning-paths/create" aria-expanded="false">
                        <i class="ti ti-circle-plus"></i>
                        <span class="hide-menu">Tạo lộ trình mới</span>
                    </a>
                </li>

                <!-- Quản lý lớp học -->
                <li class="nav-small-cap">
                    <iconify-icon icon="solar:menu-dots-linear" class="nav-small-cap-icon fs-4"></iconify-icon>
                    <span class="hide-menu">Quản lý lớp học</span>
                </li>
                <li class="sidebar-item">
                    <a class="sidebar-link"
                       th:classappend="${activePage == 'classrooms'} ? ' active'"
                       href="/teacher/classrooms" aria-expanded="false">
                        <i class="ti ti-school"></i>
                        <span class="hide-menu">Danh sách lớp</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a class="sidebar-link"
                       th:classappend="${activePage == 'classroom-create'} ? ' active'"
                       href="/teacher/classrooms/create" aria-expanded="false">
                        <i class="ti ti-circle-plus"></i>
                        <span class="hide-menu">Tạo lớp học</span>
                    </a>
                </li>

                <li><span class="sidebar-divider lg"></span></li>
                <li class="sidebar-item">
                    <a class="sidebar-link" href="/logout" aria-expanded="false">
                        <i class="ti ti-logout"></i>
                        <span class="hide-menu">Đăng xuất</span>
                    </a>
                </li>

            </ul>
        </nav>
    </div>
</aside>

</body>
</html>
