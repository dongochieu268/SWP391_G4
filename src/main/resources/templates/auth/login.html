<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - Mentora</title>
    <link rel="shortcut icon" type="image/png" th:href="@{/assets/images/logos/favicon.png}"/>
    <link rel="stylesheet" th:href="@{/assets/css/styles.min.css}"/>
</head>
<body>
<div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6"
     data-sidebartype="full" data-sidebar-position="fixed" data-header-position="fixed">
    <div class="position-relative overflow-hidden text-bg-light min-vh-100 d-flex align-items-center justify-content-center">
        <div class="d-flex align-items-center justify-content-center w-100">
            <div class="row justify-content-center w-100">
                <div class="col-md-8 col-lg-6 col-xxl-4">
                    <div class="card mb-0">
                        <div class="card-body">
                            <a href="#" class="text-nowrap logo-img text-center d-block py-3 w-100">
                                <img th:src="@{/assets/images/logos/logo.svg}" alt="Mentora">
                            </a>
                            <p class="text-center text-muted">Hệ thống Mentora — Đăng nhập Admin / Giảng viên</p>

                            <div th:if="${param.logout}" class="alert alert-success py-2">
                                Đã đăng xuất thành công.
                            </div>

                            <div th:if="${param.error != null and param.error[0] == 'role'}" class="alert alert-warning py-2">
                                Tài khoản không có quyền truy cập trang quản lý môn học.
                            </div>

                            <div th:if="${param.error != null and param.error[0] != 'role'}" class="alert alert-danger py-2">
                                Email hoặc mật khẩu không đúng.
                            </div>

                            <form th:action="@{/login/process}" method="post">
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="email" name="email"
                                           placeholder="admin@gmail.com" required>
                                </div>
                                <div class="mb-4">
                                    <label for="password" class="form-label">Mật khẩu</label>
                                    <input type="password" class="form-control" id="password" name="password"
                                           placeholder="123456" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Đăng nhập</button>
                            </form>

                            <div class="border-top pt-3 small text-muted">
                                <p class="mb-1"><strong>Admin:</strong> admin@gmail.com / 123456</p>
                                <p class="mb-1"><strong>Giảng viên:</strong> teacher@gmail.com / 123456</p>
                                <p class="mb-0 text-muted">Hoặc: admin@mentora.com / admin123</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/assets/libs/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
